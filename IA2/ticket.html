<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Ticket | Coding Conf</title>
    <link rel="icon" type="image/png" href="images/favicon-32x32.png" />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
    <script src="assets/ticket.js" defer></script>
  </head>
  <body>
    <header class="ticket-site-header">
      <img class="logo" src="images/logo-full.svg" alt="Coding Conf Logo" />
    </header>

    <main class="ticket-page">
      <h1>Congrats, <span id="ticket-name-heading"></span>!<br />Your ticket is ready.</h1>
      <p id="ticket-message" class="ticket-message" hidden>
        No registration details found. Please <a href="login.html">register</a> first.
      </p>
      <p id="ticket-confirmation" class="ticket-confirmation" hidden>
        Your ticket details are ready. Keep this page to reference your ticket.<br />
        Registration email: <span id="ticket-confirmation-email"></span>
      </p>
      <section id="ticket-card" class="ticket-card" aria-label="Conference ticket" hidden>
        <div class="ticket-main">
          <div class="ticket-heading">
            <img src="images/logo-mark.svg" alt="" />
            <div>
              <h2>Coding Conf</h2>
              <p>Jan 31, 2025 / <br>Austin, TX</p>
            </div>
          </div>
          <div class="ticket-attendee">
            <img id="ticket-avatar" class="ticket-avatar" alt="Attendee avatar" />
            <div>
              <h2 id="ticket-name"></h2>
              <p id="ticket-github"></p>
            </div>
          </div>
        </div>
        <aside class="ticket-stub" aria-label="Ticket number">
          <span>#<span id="ticket-number"></span></span>
        </aside>
      </section>
    </main>
  </body>
</html>
